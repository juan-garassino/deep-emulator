name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_TO: ${{ secrets.TELEGRAM_TO }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 3.10 = container parity (the RunPod image is the money path)
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,atari]"

      - name: Lint (flake8)
        run: make check_code
        continue-on-error: true

      - name: Format (black --check)
        run: black --check deepEmulator tests
        continue-on-error: true

      - name: Test
        run: |
          coverage run -m pytest tests/ -q --timeout 600
          coverage report -m --omit="**/site-packages/**"

      - name: Telegram notify on failure
        if: failure() && env.TELEGRAM_TOKEN != ''
        uses: appleboy/telegram-action@master
        with:
          to: ${{ env.TELEGRAM_TO }}
          token: ${{ env.TELEGRAM_TOKEN }}
          format: markdown
          message: |
            ❌ *deepEmulator CI failed*
            branch: `${{ github.ref_name }}`
            commit: `${{ github.sha }}`
            by: ${{ github.actor }}
            [run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

  smoke-import:
    # dev-machine parity: imports every public module on 3.12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (runtime deps only)
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Import smoke
        run: make smoke
