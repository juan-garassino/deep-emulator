name: ci

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,atari]"

      - name: Lint (flake8)
        run: make check_code
        continue-on-error: true

      - name: Format (black --check)
        run: black --check deepEmulator tests
        continue-on-error: true

      - name: Test
        run: |
          coverage run -m pytest tests/ -q --timeout 600
          coverage report -m --omit="**/site-packages/**"

      - name: Telegram notify on failure
        if: failure() && secrets.TELEGRAM_TOKEN != ''
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          message: |
            ❌ *deepEmulator CI failed*
            branch: `${{ github.ref_name }}`
            commit: `${{ github.sha }}`
            by: ${{ github.actor }}
            [run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
